project_name: ocictl

version: 2

builds:
  # The single binary. helmctl, crdctl and smctl below are its deprecated
  # names (see the migration table in README.md): same code, still published for two
  # releases so existing callers keep working.
  - id: ocictl
    main: ./cmd/ocictl
    binary: ocictl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: helmctl
    main: ./cmd/helmctl
    binary: helmctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: crdctl
    main: ./cmd/crdctl
    binary: crdctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: smctl
    main: ./cmd/smctl
    binary: smctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: ocictl
    ids:
      - ocictl
    formats: [tar.gz]
    name_template: "ocictl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: helmctl
    ids:
      - helmctl
    formats: [tar.gz]
    name_template: "helmctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: crdctl
    ids:
      - crdctl
    formats: [tar.gz]
    name_template: "crdctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: smctl
    ids:
      - smctl
    formats: [tar.gz]
    name_template: "smctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# The `smctl serve` image. KO_DOCKER_REPO (set by release.yaml) is the whole
# destination, ghcr.io/truvity/ocictl/smctl; `bare` publishes to exactly it.
kos:
  - id: smctl
    build: smctl
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    bare: true
    preserve_import_paths: false
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: smctl
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/ocictl

release:
  github:
    owner: truvity
    name: ocictl
  header: |
    ## ocictl {{ .Tag }}

    ### Install

    ```bash
    # Via go run (no install needed):
    go run github.com/truvity/ocictl/cmd/ocictl@{{ .Tag }} --help
    ```

    ### Deprecated: helmctl, crdctl, smctl

    `ocictl` is the single binary. `helmctl`, `crdctl` and `smctl` are still
    published, with identical flags and output, but are **deprecated** and
    will stop being published after two releases. Migrate:

    | Old | New |
    | --- | --- |
    | `helmctl <cmd>` | `ocictl chart <cmd>` |
    | `crdctl <cmd>` | `ocictl crd <cmd>` |
    | `smctl <cmd>` | `ocictl sourcemaps <cmd>` |

    The `ocictl` binary also answers to the old names when invoked through
    them (argv[0] `helmctl`, `crdctl`, `smctl`).

    ### Source-map service image

    `ghcr.io/truvity/ocictl/smctl:{{ .Version }}` — `smctl serve`, see docs/sourcemaps.md.

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
